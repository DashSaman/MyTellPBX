<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="mtRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A00"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="mtHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A00" stop-opacity="0.28"/>
      <stop offset="0.7" stop-color="#FF8A00" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FF8A00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtMedal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3947B8"/>
      <stop offset="1" stop-color="#1E2270"/>
    </linearGradient>
  </defs>

  <!-- soft orange halo behind the medallion -->
  <circle cx="320" cy="200" r="196" fill="url(#mtHalo)"/>

  <!-- faint concentric orbits -->
  <circle cx="320" cy="200" r="168" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
  <circle cx="320" cy="200" r="126" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="3 7"/>

  <!-- orange and white outer ring -->
  <circle cx="320" cy="200" r="104" fill="none" stroke="url(#mtRing)" stroke-width="7"/>

  <!-- navy medallion -->
  <circle cx="320" cy="200" r="92" fill="url(#mtMedal)"/>
  <circle cx="320" cy="200" r="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- operator headset (white) with orange mic accent -->
  <g transform="translate(320,202)">
    <path d="M-42 12 v-8 a42 42 0 0 1 84 0 v8"
          fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
    <rect x="-52" y="8" width="18" height="30" rx="9" fill="#FFFFFF"/>
    <rect x="34" y="8" width="18" height="30" rx="9" fill="#FFFFFF"/>
    <path d="M-34 38 v8 a34 20 0 0 0 68 0 v-8"
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M43 40 q-2 22 -24 26" fill="none" stroke="#FF8A00" stroke-width="8" stroke-linecap="round"/>
    <circle cx="16" cy="68" r="6.5" fill="#FF8A00"/>
  </g>

  <!-- translucent communication tile (upper right) -->
  <g opacity="0.9">
    <rect x="440" y="78" width="104" height="70" rx="14" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
    <g stroke="#FFB84D" stroke-width="4.5" stroke-linecap="round">
      <path d="M458 118 v-14"/>
      <path d="M476 118 v-26"/>
      <path d="M494 118 v-8"/>
      <path d="M512 118 v-20"/>
    </g>
    <circle cx="528" cy="98" r="5" fill="#FF8A00"/>
  </g>

  <!-- translucent communication tile (lower left) -->
  <g opacity="0.9">
    <rect x="92" y="252" width="104" height="70" rx="14" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
    <g stroke="#9FB0FF" stroke-width="4.5" stroke-linecap="round">
      <path d="M112 288 h18"/>
      <path d="M112 302 h34"/>
      <path d="M112 316 h26"/>
    </g>
    <circle cx="184" cy="288" r="5" fill="#8FA2F2"/>
  </g>

  <!-- small satellite dots on the outer orbit -->
  <circle cx="424" cy="200" r="6" fill="#FF8A00"/>
  <circle cx="216" cy="200" r="4.5" fill="#FFFFFF" fill-opacity="0.7"/>
</svg>
