  </g>
  <text x="68" y="29" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#ffffff">Mytel<tspan fill="#ffb441">PBX</tspan>
  </text>
  <text x="69" y="47" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#e0eaf7">Mytel.one</text>
