  <rect width="210" height="56" rx="9" fill="#142640" />
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#20deef" />
      <stop offset="1" stop-color="#0862ff" />
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0.4" y2="1">
      <stop stop-color="#ffd04b" />
      <stop offset="1" stop-color="#ff8100" />
