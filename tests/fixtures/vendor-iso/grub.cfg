set default="0"

function load_video {
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod all_video
}

function background {
  insmod gfxterm
  terminal_output gfxterm
  loadfont /EFI/BOOT/fonts/unicode.pf2
  insmod gfxterm_background
  insmod png
  background_image -m stretch /EFI/BOOT/splash.png
}

load_video
background
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod ext2

set timeout=60
### END /etc/grub.d/00_header ###

search --no-floppy --set=root -l 'Issabel5-x86_64'

### BEGIN /etc/grub.d/10_linux ###
menuentry 'Test this media & install Issabel 5' --class fedora --class gnu-linux --class gnu --class os {
	linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=Issabel5-x86_64 inst.geoloc=provider_fedora_geoip inst.geoloc-use-with-ks inst.ks=hd:LABEL=Issabel5-x86_64:/ks/issabel.ks net.ifnames=0 rd.live.check quiet
	initrdefi /images/pxeboot/initrd.img
}
submenu 'Troubleshooting -->' {
	menuentry 'Install Issabel 5 in basic graphics mode' --class fedora --class gnu-linux --class gnu --class os {
		linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=Issabel5-x86_64 inst.geoloc=provider_fedora_geoip inst.geoloc-use-with-ks inst.ks=hd:LABEL=Issabel5-x86_64:/ks/issabel.ks net.ifnames=0 nomodeset quiet
		initrdefi /images/pxeboot/initrd.img
	}
	menuentry 'Rescue a Issabel system' --class fedora --class gnu-linux --class gnu --class os {
		linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=Issabel5-x86_64 inst.rescue quiet
		initrdefi /images/pxeboot/initrd.img
	}
}
