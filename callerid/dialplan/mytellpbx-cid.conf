; ─── BEGIN MyTellPBX CallerID (mytellpbx.com) — inside markers is managed ───
; قلاب نرمال‌سازی شناسهٔ تماس‌گیرندهٔ ورودی؛ ترانک‌ها و کانتکست‌هایشان
; دست‌نخورده می‌مانند. ادامهٔ مسیر با همان ترتیب شامل‌های اصلی بازتولید
; می‌شود تا رفتار مسیریابی دقیقاً وفادار بماند.
[from-pstn-custom]
exten => _[0-9]!,1,NoOp(MyTellPBX CID hook: DID=${EXTEN})
 same => n,Gosub(mytellpbx-cidnorm,s,1)
 same => n,Goto(mytellpbx-from-pstn-rest,${EXTEN},1)
exten => s,1,NoOp(MyTellPBX CID hook: no-DID start)
 same => n,Gosub(mytellpbx-cidnorm,s,1)
 same => n,Goto(mytellpbx-from-pstn-rest,s,1)

[mytellpbx-cidnorm]
; پرچم سراسری MYTELLPBX_CIDNORM (از globals_custom.conf) با پیش‌فرض خاموش؛
; پرچم __MYPBX_CID_DONE از ورود دوباره جلوگیری می‌کند.
exten => s,1,GotoIf($["${MYTELLPBX_CIDNORM}" != "1"]?done)
 same => n,GotoIf($["${__MYPBX_CID_DONE}" = "1"]?done)
 same => n,AGI(mytellpbx/mytellpbx-cidnorm.php,${MYTELLPBX_CIDNORM},${MYTELLPBX_CIDNORM_QUIRKS})
 same => n(done),Return()

[mytellpbx-from-pstn-rest]
; ادامهٔ وفادار زنجیرهٔ اصلی from-pstn (همان ترتیب شامل‌ها)
include => ext-did
include => ext-did-post-custom
include => from-did-direct
include => ext-did-catchall
; ─── END MyTellPBX CallerID ───
